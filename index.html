<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12303b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مخزني">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>مخزني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: RTL phone app. Ink-colored sticky header, one content column (max 560px), fixed bottom tab bar, bottom sheets for forms.
   Status is shown by a stacked bar plus pills (out / under reorder level / in stock). */
:root{
  --bg:#eceff1; --surface:#ffffff; --fg:#13222b; --muted:#566874; --line:#d3dbe0;
  --accent:#0e7490; --on-accent:#ffffff; --head:#12303b; --on-head:#ffffff;
  --ok:#17703f; --ok-bg:#dcf2e5; --ok-fill:#2fa36b;
  --warn:#8a5200; --warn-bg:#fcebc4; --warn-fill:#e8a317;
  --bad:#b42318; --bad-bg:#fbdcd8; --bad-fill:#d64533;
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e191f; --surface:#16252d; --fg:#e6eef2; --muted:#94a6b1; --line:#294049;
    --accent:#38b2cc; --on-accent:#08222a; --head:#0a1317; --on-head:#e6eef2;
    --ok:#6fd9a0; --ok-bg:#163a2a; --warn:#f0bd5c; --warn-bg:#3d2f10; --bad:#ff8f82; --bad-bg:#40191a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e191f; --surface:#16252d; --fg:#e6eef2; --muted:#94a6b1; --line:#294049;
  --accent:#38b2cc; --on-accent:#08222a; --head:#0a1317; --on-head:#e6eef2;
  --ok:#6fd9a0; --ok-bg:#163a2a; --warn:#f0bd5c; --warn-bg:#3d2f10; --bad:#ff8f82; --bad-bg:#40191a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
#root{height:100%}
#main{height:100%;display:flex;flex-direction:column}
#main>main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:560px;margin:0 auto;width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}

/* header */
.top{flex:none;background:var(--head);color:var(--on-head)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.app{font-family:var(--f-display);font-size:12px;opacity:.75;line-height:1.2}
.top h1{margin:0;font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.3;text-wrap:balance}
.ico{width:44px;height:44px;border-radius:10px;border:1px solid color-mix(in srgb,var(--on-head) 30%,transparent);background:transparent;color:var(--on-head);display:grid;place-items:center}
.page{padding-block:14px 18px}

/* nav */
.nav{flex:none;background:var(--surface);border-top:1px solid var(--line)}
.nav-in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;min-height:58px;font-size:11px;color:var(--muted);background:none;border:0}
.nav .ic{width:48px;height:27px;border-radius:14px;display:grid;place-items:center}
.nav button[aria-current="page"]{color:var(--fg);font-weight:600}
.nav button[aria-current="page"] .ic{background:var(--accent);color:var(--on-accent)}

/* basics */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stack{display:grid;gap:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
h2.sec{margin:20px 0 8px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.card h2{margin:0 0 10px;font-size:16px;font-family:var(--f-display);font-weight:700}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
textarea{resize:vertical}
input[type=checkbox]{width:20px;min-height:20px;height:20px;accent-color:var(--accent)}
input[type=color]{padding:3px}
.chk{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:14px}
.btn{min-height:44px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.link{background:none;border:0;padding:6px 0;color:inherit;text-decoration:underline;font-size:14px}
.err{margin:0;color:var(--bad);font-size:14px;font-weight:500}
.note{margin:0;color:var(--muted);font-size:13px}
.empty{padding:22px 12px;text-align:center;color:var(--muted)}

/* report */
.hl{font-size:16px;margin:0 0 12px}
.hl b{font-family:var(--f-display);font-size:30px;margin-inline-end:4px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--line)}
.bar i{display:block;min-width:0}
.s-out{background:var(--bad-fill)} .s-low{background:var(--warn-fill)} .s-ok{background:var(--ok-fill)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sums small{display:block;color:var(--muted);font-size:12px}
.sums b{font-size:17px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin:16px 0 8px}
.chip{flex:none;min-height:38px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--muted);border-radius:var(--radius);font-size:13px;margin-bottom:12px}
.demo .btn{min-height:38px}

/* tables */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl .nm{font-weight:600;min-width:110px}
.tbl small,.big small{color:var(--muted);font-weight:400}
.sug{color:var(--accent)}
.sub{color:var(--muted);font-size:12px}
.pill{display:inline-block;margin-top:4px;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;line-height:1.6}
.pill.ok,.pill.recv{background:var(--ok-bg);color:var(--ok)}
.pill.low,.pill.sent{background:var(--warn-bg);color:var(--warn)}
.pill.out{background:var(--bad-bg);color:var(--bad)}
.pill.draft{background:var(--line);color:var(--fg)}

.bar-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-inline-start:38px}
.ocard{display:grid;gap:4px;width:100%;text-align:start;padding:12px 14px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.ocard .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ocard .pill{margin:0}
.po-no{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.03em}

/* sheet */
.shwrap{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(8,16,22,.55)}
.sheet{position:absolute;inset:auto 0 0 0;margin:0 auto;max-width:600px;max-height:92%;overflow:auto;overscroll-behavior:contain;background:var(--bg);color:var(--fg);border-radius:16px 16px 0 0;padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
.sheet.full{height:92%}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.sh-h h2{margin:0;font-family:var(--f-display);font-size:20px;text-wrap:balance}
.x{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;display:grid;place-items:center;flex:none}
.big{font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1.2;margin-bottom:10px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 16px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.line{display:grid;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px}
.line-h{display:flex;gap:8px}
.line-h select{flex:1;min-width:0}
.line-t{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.line-t b{color:var(--fg);font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;font-size:15px}
.tot b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.box{padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);display:grid;gap:10px;margin-top:12px}
.box.warnbox{border-color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:min(92vw,440px);background:var(--head);color:var(--on-head);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);text-align:center}

/* settings */
.pres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pre{display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:14px}
.sw{display:flex;border-radius:5px;overflow:hidden;flex:none;border:1px solid var(--line)}
.sw i{display:block;width:13px;height:26px}

/* lock */
.lock{position:fixed;inset:0;z-index:50;overflow:auto;background:var(--head);color:var(--on-head);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lock-in{max-width:380px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-block:32px}
.lock h1{margin:0;font-family:var(--f-display);font-size:46px;line-height:1.1}
.lock .sub{margin:0;font-size:15px;color:inherit;opacity:.8}
.lock .card{color:var(--fg);padding:16px}
.lock .note,.lock .link{color:inherit;opacity:.85}
.lock .box{color:var(--fg)}

/* movements and split layouts */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{min-height:46px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill.min{background:var(--ok-bg);color:var(--ok)}
.pill.mout{background:var(--warn-bg);color:var(--warn)}
.qin b{color:var(--ok)}
.qout b{color:var(--warn)}
.home-a,.home-b,.isplit>div{min-width:0}
.lk-a,.lk-b{display:flex;flex-direction:column;gap:12px}
.hbtns{display:flex;gap:8px}
a.btn{text-decoration:none}
.sheet.snap{inset:0;margin:0;max-width:none;max-height:none;height:100%;border-radius:0;background:var(--surface)}
.snap-t{margin:0;font-family:var(--f-display);font-size:24px;text-wrap:balance}

/* landscape: #root gets .land from the screen shape or the user's choice in settings.
   The nav becomes a side rail on the right; the header and content fill the rest of the screen. */
.seg.s3{grid-template-columns:repeat(3,1fr)}
#root.land #main{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
#root.land .nav{grid-column:1;grid-row:1 / span 2;border-top:0;border-inline-end:1px solid var(--line);width:calc(78px + env(safe-area-inset-right,0px));overflow-y:auto}
#root.land .nav.gut{padding-left:0;padding-right:env(safe-area-inset-right,0px)}
#root.land .nav .in{max-width:none;height:100%;margin:0}
#root.land .nav-in{display:flex;flex-direction:column;justify-content:space-evenly}
#root.land .nav button{flex:1 1 0;min-height:0;padding:3px 2px;justify-content:center}
#root.land .top{grid-column:2;grid-row:1}
#root.land #main>main{grid-column:2;grid-row:2}
#root.land .top.gut,#root.land main.gut{padding-right:16px}
#root.land .in{max-width:1100px}
#root.land .top-in{padding-block:6px}
#root.land .app{display:none}
#root.land .top h1{font-size:18px}
#root.land .ico{width:40px;height:40px}
#root.land .page{padding-block:10px 14px}
#root.land .home{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:16px;align-items:start}
#root.land .home-b .chips{margin-top:0}
#root.land .isplit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
#root.land .sheet{max-width:780px;max-height:100%}
#root.land .sheet.full{height:100%}
#root.land .sheet.snap{max-width:none;max-height:none;height:100%}
#root.land .toast{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:calc(50% - 39px)}
#root.land .lock-in{flex-direction:row;align-items:center;max-width:780px;gap:28px}
#root.land .lk-a,#root.land .lk-b{flex:1;min-width:0}
@media (max-height:520px){
  #root.land .tbl td{padding:7px 10px}
  #root.land .tbl th{padding:6px 10px}
  #root.land .card{padding:10px 12px}
  #root.land .hl{margin-bottom:8px;font-size:15px}
  #root.land .hl b{font-size:24px}
  #root.land .sums{margin-top:10px;padding-top:8px}
  #root.land input,#root.land select,#root.land textarea,#root.land .btn{min-height:40px}
  #root.land .chips{margin:8px 0 6px}
  #root.land .big{font-size:28px;margin-bottom:6px}
  #root.land .kv{margin-bottom:10px;padding:8px 10px}
  #root.land .sheet{padding-top:10px}
  #root.land .sh-h{margin-bottom:8px}
  #root.land .lock h1{font-size:34px}
  #root.land .lock-in{padding-block:10px}
}
</style>


</head>
<body>
<div id="root" dir="rtl" lang="ar">
  <div id="lock" class="lock" hidden></div>
  <div id="main" hidden>
    <header class="top gut">
      <div class="in top-in">
        <div><div class="app">مخزني</div><h1 id="hdrTitle"></h1></div>
        <div class="hbtns"><button class="ico" data-act="snapPage" id="snapBtn" aria-label="لقطة شاشة"></button><button class="ico" data-act="tab" data-v="set" id="setBtn" aria-label="الإعدادات"></button><button class="ico" data-act="lock" id="lockBtn" aria-label="قفل التطبيق"></button></div>
      </div>
    </header>
    <main class="gut"><div class="in page" id="page"></div></main>
    <nav class="nav gut" aria-label="التنقل"><div class="in nav-in" id="nav"></div></nav>
  </div>
  <div id="sheetWrap" class="shwrap" hidden>
    <div class="scrim" data-act="closeSheet"></div>
    <section class="sheet gutless" id="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script>
(function(){
'use strict';
try{document.documentElement.dir='rtl';document.documentElement.lang='ar';}catch(e){}

/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s);};
function toTop(){var m=document.querySelector('#main>main');if(m)m.scrollTop=0;}
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var toNum=function(v){var s=String(v==null?'':v).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632;}).replace(/[٫,]/g,'.');var n=parseFloat(s);return isFinite(n)?n:0;};
var fmt=function(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});};
var pad=function(n){return String(n).padStart(2,'0');};
var today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var poNo=function(n){return 'PO-'+String(n).padStart(4,'0');};
function dAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var fd=function(d){var p=String(d).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d;};
var clone=function(o){return JSON.parse(JSON.stringify(o));};
var IC={
  report:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  items:'<path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/>',
  orders:'<path d="M7 3h8l4 4v14H7zM15 3v4h4M10 12h6M10 16h6"/>',
  sup:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 5.5a3 3 0 010 5.5M18 14.5c2 .7 3.5 2.6 3.5 5.5"/>',
  set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  crate:'<path d="M4 9l8-4 8 4-8 4-8-4zM4 9v8l8 4 8-4V9M12 13v8M8 7l8 4"/>',
  move:'<path d="M7 4v14M3 14l4 4 4-4M17 20V6M13 10l4-4 4 4"/>',
  cam:'<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 12h.01M17.5 12h.01"/>'
};
var svg=function(k,s){s=s||22;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[k]+'</svg>';};

var unitsList=function(){var s=new Set(DEF_UNITS.concat(db.units||[]).concat(db.items.map(function(i){return i.unit;})));return Array.from(s).filter(Boolean);};

function randSalt(){try{var a=new Uint8Array(8);crypto.getRandomValues(a);return Array.from(a).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}catch(e){return String(Math.random()).slice(2);}}
async function hash(p,salt){
  try{
    var b=new TextEncoder().encode(salt+':'+p);
    var d=await crypto.subtle.digest('SHA-256',b);
    return Array.from(new Uint8Array(d)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
  }catch(e){
    var h=5381,s=salt+':'+p;
    for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}
    return 'f'+h;
  }
}

var stat=function(i){return i.qty<=0?'out':(i.qty<=i.reorder?'low':'ok');};
var STL={out:'نفد',low:'تحت حد الطلب',ok:'متوفر'};
var pill=function(s){return '<span class="pill '+s+'">'+STL[s]+'</span>';};
var sug=function(i){return Math.max(Math.ceil(i.reorder*2-i.qty),1);};
var money=function(n){return fmt(n)+' '+esc(db.currency);};
var rank={out:0,low:1,ok:2};
var codeCmp=function(a,b){var x=String(a.code||''),y=String(b.code||'');if(x&&!y)return -1;if(!x&&y)return 1;var c=x.localeCompare(y,'en',{numeric:true});return c||a.name.localeCompare(b.name,'ar');};
function sortItems(a){return a.slice().sort(function(x,y){var rx=stat(x),ry=stat(y);if(rx!==ry)return rank[rx]-rank[ry];return codeCmp(x,y);});}
function nextCode(){
  var pre=db.codePre||'',mx=0;
  db.items.forEach(function(i){var c=String(i.code||'');if(pre&&c.indexOf(pre)!==0)return;var r=c.slice(pre.length);if(/^\d+$/.test(r))mx=Math.max(mx,parseInt(r,10));});
  return pre+String(mx+1).padStart(4,'0');
}

/* ---------- theme ---------- */
var hex2=function(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
var toHex=function(a){return '#'+a.map(function(v){return Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0');}).join('');};
var lum=function(h){var c=hex2(h).map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];};
var mix=function(a,b,t){var x=hex2(a),y=hex2(b);return toHex(x.map(function(v,i){return v+(y[i]-v)*t;}));};
var onC=function(h){return lum(h)>0.45?'#10202a':'#ffffff';};
function applyTheme(){
  var st=document.documentElement.style;
  ['--bg','--surface','--fg','--muted','--line','--head','--on-head','--accent','--on-accent','color-scheme'].forEach(function(k){st.removeProperty(k);});
  var t=db.theme;if(!t)return;
  if(t.bg){
    var dark=lum(t.bg)<0.3;
    st.setProperty('--bg',t.bg);
    if(dark){st.setProperty('--surface',mix(t.bg,'#ffffff',0.07));st.setProperty('--line',mix(t.bg,'#ffffff',0.17));st.setProperty('--fg','#e8eef2');st.setProperty('--muted','#a3b3bd');st.setProperty('color-scheme','dark');}
    else{st.setProperty('--surface',mix(t.bg,'#ffffff',0.7));st.setProperty('--line',mix(t.bg,'#000000',0.13));st.setProperty('--fg','#13222b');st.setProperty('--muted','#566874');st.setProperty('color-scheme','light');}
  }
  if(t.head){st.setProperty('--head',t.head);st.setProperty('--on-head',onC(t.head));}
  if(t.accent){st.setProperty('--accent',t.accent);st.setProperty('--on-accent',onC(t.accent));}
}

function saveMove(){
  var orig=mv.editId?byId(db.moves,mv.editId):null;
  var it=byId(db.items,mv.itemId),q=toNum(mv.qty),isIn=mv.type==='in';
  if(!it)return ferr('اختر الصنف.');
  if(q<=0)return ferr('اكتب كمية أكبر من صفر.');
  var avail=it.qty;
  if(orig&&orig.itemId===it.id)avail=orig.type==='in'?it.qty-orig.qty:it.qty+orig.qty;
  if(!isIn&&q>avail)return ferr('الكمية أكبر من الرصيد المتاح ('+fmt(Math.max(avail,0))+' '+it.unit+').');
  var price=isIn?(toNum(mv.price)||it.price):it.price;
  if(orig){var oi=byId(db.items,orig.itemId);if(oi)oi.qty=orig.type==='in'?Math.max(0,oi.qty-orig.qty):oi.qty+orig.qty;}
  it.qty=isIn?it.qty+q:it.qty-q;
  if(isIn&&mv.upd&&price>0)it.price=price;
  var rec={itemId:it.id,name:it.name,unit:it.unit,type:mv.type,qty:q,price:price,date:mv.date||today(),note:(mv.note||'').trim()};
  if(orig){
    Object.assign(orig,rec);
  }else{
    rec.id=nid();rec.src='manual';db.moves.push(rec);
    var cid=+mv.custId||0;
    if(!isIn&&cid){
      var amt=toNum(mv.amount)||q*(it.sell||it.price),paid=Math.min(toNum(mv.paid),amt);
      db.ledger.push({id:nid(),customerId:cid,type:'charge',amount:amt,date:rec.date,note:'بيع '+fmt(q)+' '+it.unit+' '+it.name,moveId:rec.id});
      if(paid>0)db.ledger.push({id:nid(),customerId:cid,type:'pay',amount:paid,date:rec.date,note:'دفعة عند البيع',method:'نقدي',moveId:rec.id});
    }
  }
  save();closeSheet();render();
  toast(orig?'تم حفظ التعديل':(isIn?'تم تسجيل حركة الوارد':'تم تسجيل حركة الصادر'));
}

   +'<dl class="kv" style="margin:0"><dt>الصنف</dt><dd>'+esc(m.name)+'</dd><dt>الكمية</dt><dd>'+fmt(m.qty)+' '+esc(m.unit)+'</dd><dt>سعر الوحدة</dt><dd>'+money(m.price)+'</dd><dt>القيمة</dt><dd>'+money(m.qty*m.price)+'</dd><dt>التاريخ</dt><dd>'+fd(m.date)+'</dd>'

/* customers and collections */
function balOf(cid){return db.ledger.reduce(function(s,e){return e.customerId===cid?s+(e.type==='charge'?e.amount:-e.amount):s;},0);}
var ledSort=function(a,b){return a.date<b.date?-1:(a.date>b.date?1:a.id-b.id);};
function stmt(cid){
  var run=0;
  return db.ledger.filter(function(e){return e.customerId===cid;}).sort(ledSort).map(function(e){run+=e.type==='charge'?e.amount:-e.amount;return {e:e,bal:run};}).reverse();
}
var balCell=function(b){return b>0?'<b style="color:var(--warn)">'+money(b)+'</b>':(b<0?'<b style="color:var(--ok)">له '+money(-b)+'</b>':'<span class="pill ok">مسدد</span>');};
function colHTML(){
  var rows=db.customers.map(function(c){return {c:c,b:balOf(c.id)};});
  var due=rows.reduce(function(s,r){return s+Math.max(r.b,0);},0),n=rows.filter(function(r){return r.b>0;}).length;
  var from=dAgo(29),coll=db.ledger.filter(function(e){return e.type==='pay'&&e.date>=from;}).reduce(function(s,e){return s+e.amount;},0);
  var list=rows.filter(function(r){return colF==='all'||r.b>0;}).sort(function(a,b){return b.b-a.b||a.c.name.localeCompare(b.c.name,'ar');});
  var chips=[['due','عليهم مستحق'],['all','كل العملاء']].map(function(f){return '<button class="chip" data-act="colFilter" data-v="'+f[0]+'" aria-pressed="'+(colF===f[0])+'">'+f[1]+'</button>';}).join('');
  var body=list.length?list.map(function(r){
    var last=db.ledger.filter(function(e){return e.customerId===r.c.id;}).sort(ledSort).pop();
    return '<tr data-act="cust" data-id="'+r.c.id+'" tabindex="0"><td><div class="nm">'+esc(r.c.name)+'</div>'+(r.c.phone?'<div class="sub" dir="ltr" style="text-align:start">'+esc(r.c.phone)+'</div>':'')+'</td>'
      +'<td class="n">'+balCell(r.b)+'</td><td class="n"><span class="sub">'+(last?fd(last.date):'—')+'</span></td></tr>';
  }).join(''):'<tr><td colspan="3" class="empty">'+(db.customers.length?'لا يوجد عملاء عليهم مستحق.':'لا يوجد عملاء. اضغط «عميل» لإضافة أول عميل.')+'</td></tr>';
  return '<div class="bar-row"><div style="flex:1"></div><button class="btn pri" data-act="newCust">'+svg('plus',18)+' عميل</button></div>'
   +'<section class="card"><p class="hl"><b>'+n+'</b> عميل عليهم مستحق</p>'
   +'<div class="sums" style="margin-top:0"><div><small>إجمالي المستحق</small><b>'+money(due)+'</b></div><div><small>المحصّل آخر 30 يوماً</small><b>'+money(coll)+'</b></div></div></section>'
   +'<div class="chips" role="group" aria-label="تصفية العملاء">'+chips+'</div>'
   +'<div class="scroll"><table class="tbl"><thead><tr><th>العميل</th><th>المستحق</th><th>آخر تعامل</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function custSheet(id){
  var c=byId(db.customers,id);if(!c)return '';
  var b=balOf(id);
  var rows=stmt(id).map(function(r){
    var e=r.e,ch=e.type==='charge';

/* whatsapp */
function waNum(p){
  var d=String(p||'').replace(/[٠-٩]/g,function(x){return x.charCodeAt(0)-1632;}).replace(/\D/g,'');
  if(!d)return '';
  if(d.indexOf('00')===0)return d.slice(2);
  if(d[0]==='0')return (db.cc||'20')+d.slice(1);
  return d;
}
function waHref(text,phone){return 'https://wa.me/'+waNum(phone)+'?text='+encodeURIComponent(text);}
function curRec(){return od.status==='draft'?{no:od.no,supplierId:od.supplierId,date:od.date,note:od.note,lines:validLines()}:od;}
function reportText(){
  var need=sortItems(db.items.filter(function(i){return stat(i)!=='ok';}));
  var L=need.map(function(i,n){return (n+1)+') '+i.name+' — المتاح '+fmt(i.qty)+' '+i.unit+' (حد الطلب '+fmt(i.reorder)+') — المقترح '+fmt(sug(i))+' '+i.unit;});
  return ['تقرير النواقص — '+fd(today()),''].concat(L.length?L:['لا توجد نواقص.']).join('\n');
}
function waBuild(w){
  var k=w.dataset.wa,id=+w.dataset.id||0;
  if(k==='order'){
    var r=curRec();
    if(!r.lines.length){toast('أضف صنفاً واحداً على الأقل بكمية أكبر من صفر.');return null;}
    var s=byId(db.suppliers,r.supplierId);
    return {text:orderText(r),phone:s?s.phone:''};
  }
  if(k==='cust'){
    var c=byId(db.customers,id);if(!c)return null;
    return {text:'مرحباً '+c.name+'،\nنفيدكم بأن رصيدكم المستحق حتى '+fd(today())+' هو '+fmt(balOf(id))+' '+db.currency+'.\nنرجو التفضل بالسداد. شكراً لتعاونكم.',phone:c.phone};
  }
  if(k==='receipt'){
    var e=byId(db.ledger,id),c2=e?byId(db.customers,e.customerId):null;if(!c2)return null;
    return {text:'إيصال تحصيل\nتم استلام مبلغ '+fmt(e.amount)+' '+db.currency+' من '+c2.name+' بتاريخ '+fd(e.date)+(e.method?' ('+e.method+')':'')+'.\nالرصيد المتبقي: '+fmt(balOf(c2.id))+' '+db.currency+'.',phone:c2.phone};
  }
  if(k==='report')return {text:reportText(),phone:''};
  return null;
}

  var lines=validLines();
  if(!lines.length){toast('أضف صنفاً واحداً على الأقل بكمية أكبر من صفر.');return false;}
  if(status==='sent'&&!od.supplierId){toast('اختر المورد قبل تعليم الأمر كمُرسل.');return false;}
  var rec={id:od.id||nid(),no:od.no||db.seq++,supplierId:od.supplierId||0,date:od.date||today(),note:od.note||'',status:status||od.status,lines:lines};
  var idx=db.orders.findIndex(function(o){return o.id===rec.id;});
  if(idx>=0)db.orders[idx]=rec;else db.orders.push(rec);
  save();od=clone(rec);return true;
}
function orderText(o){
  var sup=byId(db.suppliers,o.supplierId),tot=0;
  var L=o.lines.map(function(l,i){var t=l.qty*l.price;tot+=t;return (i+1)+') '+l.name+' — '+fmt(l.qty)+' '+l.unit+' × '+fmt(l.price)+' = '+fmt(t)+' '+db.currency;});
  return ['أمر توريد '+(o.no?poNo(o.no):''),sup?'المورد: '+sup.name:null,'التاريخ: '+o.date,''].concat(L,['','الإجمالي: '+fmt(tot)+' '+db.currency,o.note?'ملاحظات: '+o.note:null]).filter(function(x){return x!==null;}).join('\n');
}
function updTotals(){
  od.lines.forEach(function(l,i){var e=document.querySelector('[data-lt="'+i+'"]');if(e)e.textContent=fmt(l.qty*l.price)+' '+db.currency;});
  var g=$('#grand');if(g)g.textContent=fmt(grand(od.lines))+' '+db.currency;
}
function mkOrders(){
  var need=db.items.filter(function(i){return stat(i)!=='ok';});
  if(!need.length)return;
  var groups={};
  need.forEach(function(i){var k=i.supplierId||0;(groups[k]=groups[k]||[]).push(i);});
  var made=Object.keys(groups).map(function(k){
    var rec={id:nid(),no:db.seq++,supplierId:+k,date:today(),note:'',status:'draft',lines:groups[k].map(function(i){return {itemId:i.id,name:i.name,qty:sug(i),unit:i.unit,price:i.price};})};
    db.orders.push(rec);return rec;
  });
  save();tab='orders';render();toTop();
  if(made.length===1)openOrder(made[0].id);else toast('تم إنشاء '+made.length+' أوامر توريد كمسودات حسب المورد.');
}
function recvConfirm(){
  var mism=od.lines.filter(function(l){var it=byId(db.items,l.itemId);return it&&l.unit&&l.unit!==it.unit;});
  var c=$('#confirm');
  c.innerHTML='<div class="box'+(mism.length?' warnbox':'')+'"><b>تأكيد الاستلام</b><p class="note" style="color:var(--fg)">ستُضاف كميات الأسطر إلى رصيد الأصناف.</p>'
   +(mism.length?'<p class="note" style="color:var(--warn)">وحدة التعامل تختلف عن وحدة المخزون في: '+mism.map(function(l){var it=byId(db.items,l.itemId);return esc(l.name)+' ('+esc(l.unit)+' بدل '+esc(it.unit)+')';}).join('، ')+'. ستُضاف الكميات كما هي دون تحويل.</p>':'')
   +'<label class="chk"><input type="checkbox" id="updPrice" checked> تحديث سعر الوحدة في المخزون بسعر هذا الأمر</label>'
   +'<div class="two"><button class="btn pri" data-act="recvDo">تأكيد الاستلام</button><button class="btn" data-act="noConfirm">إلغاء</button></div></div>';
}
function askBox(msg,act,id,label){
  $('#confirm').innerHTML='<div class="box warnbox"><p class="note" style="color:var(--fg)">'+msg+'</p><div class="two"><button class="btn danger" data-act="'+act+'" data-id="'+(id||'')+'">'+label+'</button><button class="btn" data-act="noConfirm">إلغاء</button></div></div>';
}

/* ---------- clipboard ---------- */
function copyText(text){
  var fallback=function(){
    var a=$('#copyArea');
    if(!a){toast('تعذر النسخ تلقائياً.');return;}
    a.innerHTML='<label>حدد النص وانسخه<textarea id="copyBox" rows="8" readonly>'+esc(text)+'</textarea></label>';
    var b=$('#copyBox');if(b){b.focus();b.select();}
  };
  try{navigator.clipboard.writeText(text).then(function(){toast('تم النسخ');},fallback);}catch(e){fallback();}
}

/* ---------- actions ---------- */
function act(a,t){
  var id=+t.dataset.id||0;
  switch(a){
    case 'tab':tab=t.dataset.v;render();toTop();break;
    case 'lock':renderLock();break;
    case 'filter':filter=t.dataset.v;render();break;
    case 'closeSheet':closeSheet();break;
    case 'noConfirm':$('#confirm').innerHTML='';break;
    case 'forgot':$('#forgotBox').hidden=false;break;
    case 'wipe':db=fresh();save();applyTheme();renderLock();break;
    case 'wipeAsk':$('#wipeBox').innerHTML='<div class="box warnbox"><p class="note" style="color:var(--fg)">سيُمسح كل شيء: الأصناف والموردون والأوامر وكلمة المرور. لا يمكن التراجع.</p><div class="two"><button class="btn danger" data-act="wipe">نعم، امسح كل شيء</button><button class="btn" data-act="wipeNo">إلغاء</button></div></div>';break;
    case 'wipeNo':$('#wipeBox').innerHTML='';break;
    case 'clearDemo':
      var ds=db.suppliers.filter(function(s){return s.demo;}).map(function(s){return s.id;}),di=db.items.filter(function(i){return i.demo;}).map(function(i){return i.id;});
      db.orders=db.orders.filter(function(o){return ds.indexOf(o.supplierId)<0&&!o.lines.some(function(l){return di.indexOf(l.itemId)>-1;});});
      db.items=db.items.filter(function(i){return !i.demo;});db.suppliers=db.suppliers.filter(function(s){return !s.demo;});
      db.moves=db.moves.filter(function(m){return !m.demo&&di.indexOf(m.itemId)<0;});
      var dc=db.customers.filter(function(c){return c.demo;}).map(function(c){return c.id;});
      db.ledger=db.ledger.filter(function(e){return !e.demo&&dc.indexOf(e.customerId)<0;});
      db.customers=db.customers.filter(function(c){return !c.demo;});
      db.demo=false;save();render();toast('تم مسح البيانات التجريبية');break;
    /* items */
    case 'item':openSheet(function(){return itemSheet(id);});break;
    case 'newItem':openSheet(function(){return itemForm(0);});break;
    case 'editItem':openSheet(function(){return itemForm(id);});break;
    case 'delItemAsk':askBox('سيُحذف الصنف من المخزون. أوامر التوريد السابقة تحتفظ باسمه.','delItem',id,'حذف الصنف');break;
    case 'delItem':db.items=db.items.filter(function(i){return i.id!==id;});save();closeSheet();render();toast('تم حذف الصنف');break;
    /* movements */
    case 'newMove':
      var nit=id?byId(db.items,id):null;
      mv={editId:0,type:t.dataset.t||'in',itemId:id||0,qty:'',date:today(),price:nit?nit.price:'',note:'',upd:true,custId:0,amount:'',paid:''};
      openSheet(moveForm);break;
    case 'mvType':mv.type=t.dataset.t;paint();break;
    case 'mvFilter':mvF=t.dataset.v;render();break;
    case 'move':openSheet(function(){return moveSheet(id);});break;
    case 'delMoveAsk':askBox('سيُحذف السجل وتُعكس الكمية على رصيد الصنف'+(db.ledger.some(function(e){return e.moveId===id;})?'، وتُحذف مديونية العميل المرتبطة بها.':'.'),'delMove',id,'حذف وعكس الأثر');break;
    case 'delMove':
      var dm=byId(db.moves,id),dit=dm?byId(db.items,dm.itemId):null;
      if(dm&&dit){dit.qty=dm.type==='in'?Math.max(0,dit.qty-dm.qty):dit.qty+dm.qty;}
      db.moves=db.moves.filter(function(m){return m.id!==id;});db.ledger=db.ledger.filter(function(e){return e.moveId!==id;});save();closeSheet();render();toast('تم حذف الحركة');break;
    /* suppliers */
    case 'sup':openSheet(function(){return supForm(id);});break;
    case 'newSup':openSheet(function(){return supForm(0);});break;
    case 'delSupAsk':
      var used=db.items.some(function(i){return i.supplierId===id;})||db.orders.some(function(o){return o.supplierId===id;});
      if(used){toast('لا يمكن حذف مورد مرتبط بأصناف أو أوامر توريد.');break;}
      askBox('سيُحذف المورد نهائياً.','delSup',id,'حذف المورد');break;
    case 'delSup':db.suppliers=db.suppliers.filter(function(s){return s.id!==id;});save();closeSheet();render();toast('تم حذف المورد');break;
    /* orders */
    case 'mkOrders':mkOrders();break;
    case 'newOrder':openOrder(0);break;
    case 'order':openOrder(id);break;
    case 'addLine':od.lines.push({itemId:0,name:'',qty:0,unit:'',price:0});paint();break;
    case 'rmLine':od.lines.splice(+t.dataset.i,1);if(!od.lines.length)od.lines.push({itemId:0,name:'',qty:0,unit:'',price:0});paint();break;
    case 'saveOrder':if(saveOrder('draft')){render();paint();toast('تم حفظ المسودة');}break;
    case 'sendOrder':if(saveOrder('sent')){render();paint();toast('تم حفظ الأمر كمُرسل');}break;
    case 'reopen':od.status='draft';saveOrder('draft');render();paint();break;
    case 'copyOrder':
      var rec=od.status==='draft'?{no:od.no,supplierId:od.supplierId,date:od.date,note:od.note,lines:validLines()}:od;
      if(!rec.lines.length){toast('أضف صنفاً واحداً على الأقل بكمية أكبر من صفر.');break;}
      copyText(orderText(rec));break;
    case 'recvAsk':recvConfirm();break;
    case 'recvDo':
      var upd=$('#updPrice').checked;
      od.lines.forEach(function(l){
        var it=byId(db.items,l.itemId);
        if(it){it.qty+=l.qty;if(upd&&l.price>0)it.price=l.price;}
        db.moves.push({id:nid(),itemId:l.itemId,name:l.name,unit:l.unit||(it?it.unit:''),type:'in',qty:l.qty,price:l.price||(it?it.price:0),date:today(),note:'أمر توريد '+poNo(od.no),src:'po'});
      });
      od.status='received';var ix=db.orders.findIndex(function(o){return o.id===od.id;});if(ix>=0)db.orders[ix]=clone(od);
      save();render();paint();toast('تم الاستلام وتحديث المخزون');break;
    case 'delOrderAsk':askBox(od.status==='received'?'سيُحذف الأمر من السجل، ولن تتغير أرصدة المخزون التي أُضيفت عند الاستلام.':'سيُحذف أمر التوريد نهائياً.','delOrder',od.id,'حذف الأمر');break;
    case 'delOrder':
      if(od.id){db.orders=db.orders.filter(function(o){return o.id!==od.id;});save();render();}
      closeSheet();toast('تم حذف الأمر');break;
    case 'editMove':
      var em=byId(db.moves,id);
      mv={editId:em.id,type:em.type,itemId:em.itemId,qty:em.qty,date:em.date,price:em.price,note:em.note||'',upd:false,custId:0,amount:'',paid:''};
      openSheet(moveForm);break;
    /* collections */
    case 'colFilter':colF=t.dataset.v;render();break;
    case 'cust':openSheet(function(){return custSheet(id);});break;
    case 'newCust':openSheet(function(){return custForm(0);});break;
    case 'editCust':openSheet(function(){return custForm(id);});break;
    case 'delCustAsk':askBox('سيُحذف العميل مع كل سجل حسابه.','delCust',id,'حذف العميل');break;
    case 'delCust':db.customers=db.customers.filter(function(c){return c.id!==id;});db.ledger=db.ledger.filter(function(e){return e.customerId!==id;});save();closeSheet();render();toast('تم حذف العميل');break;
    case 'newLed':led={editId:0,customerId:id,type:t.dataset.t,amount:'',date:today(),note:'',method:'نقدي'};openSheet(ledForm);break;
    case 'ledType':led.type=t.dataset.t;paint();break;
    case 'led':openSheet(function(){return ledSheet(id);});break;
    case 'editLed':
      var le=byId(db.ledger,id);
      led={editId:le.id,customerId:le.customerId,type:le.type,amount:le.amount,date:le.date,note:le.note||'',method:le.method||'نقدي'};
      openSheet(ledForm);break;
    case 'delLedAsk':askBox('سيُحذف هذا السجل من حساب العميل.','delLed',id,'حذف السجل');break;
    case 'delLed':
      var dl=byId(db.ledger,id),dcid=dl?dl.customerId:0;
      db.ledger=db.ledger.filter(function(e){return e.id!==id;});save();render();
      openSheet(function(){return custSheet(dcid);});toast('تم حذف السجل');break;
    /* snapshots */
    case 'snapOrder':
      if(!curRec().lines.length){toast('أضف صنفاً واحداً على الأقل بكمية أكبر من صفر.');break;}
      openSnap(snapOrderHTML);break;
    case 'snapReport':openSnap(snapReportHTML);break;
    case 'snapCust':openSnap(function(){return snapCustHTML(id);});break;
    case 'snapBack':snapBack();break;
    case 'snapPage':openSnap(snapPageHTML);break;
    case 'layout':db.layout=t.dataset.v;save();applyLayout();render();break;
    case 'renumber':
      var cnt=0;db.items.slice().sort(function(a,b){return a.id-b.id;}).forEach(function(i){if(!i.code){i.code=nextCode();cnt++;}});
      save();render();toast(cnt?'تم ترقيم '+cnt+' من الأصناف':'كل الأصناف لها كود');break;
    /* settings */
    case 'preset':db.theme=PRESETS[+t.dataset.i].t?Object.assign({},PRESETS[+t.dataset.i].t):null;applyTheme();save();render();break;
    case 'copyBackup':
      var d={app:'makhzani',v:1,currency:db.currency,units:db.units,suppliers:db.suppliers,items:db.items,orders:db.orders,moves:db.moves,customers:db.customers,ledger:db.ledger,cc:db.cc,codePre:db.codePre,seq:db.seq,uid:db.uid,theme:db.theme};
      copyText(JSON.stringify(d));break;
    case 'restore':
      try{
        var r=JSON.parse($('#restoreTxt').value);
        if(!r||r.app!=='makhzani'||!Array.isArray(r.items)||!Array.isArray(r.suppliers)||!Array.isArray(r.orders))throw new Error('x');
        ['currency','units','suppliers','items','orders','moves','customers','ledger','cc','codePre','seq','uid','theme'].forEach(function(k){if(r[k]!==undefined)db[k]=r[k];});
        if(!Array.isArray(db.moves))db.moves=[];
        if(!Array.isArray(db.customers))db.customers=[];
        if(!Array.isArray(db.ledger))db.ledger=[];
        db.demo=db.items.some(function(i){return i.demo;})||db.suppliers.some(function(s){return s.demo;});
        save();applyTheme();render();toast('تمت استعادة البيانات');
      }catch(e){toast('النسخة غير صالحة. الصق النص كاملاً كما نُسخ.');}
      break;
  }
}

document.addEventListener('click',function(e){
  var w=e.target.closest('[data-wa]');
  if(w){var r=waBuild(w);if(!r){e.preventDefault();return;}w.href=waHref(r.text,r.phone);return;}
  var t=e.target.closest('[data-act]');if(t)act(t.dataset.act,t);
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-act]')){e.preventDefault();act(e.target.dataset.act,e.target);}
  if(e.key==='Escape'&&redraw){if(snapOn)snapBack();else closeSheet();}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){query=t.value;$('#itemsBody').innerHTML=itemsTable();return;}
  if(t.id==='cur'){db.currency=t.value.trim()||'ج.م';save();return;}
  if(t.id==='cpre'){db.codePre=t.value.trim();save();return;}
  if(t.id==='cc'){db.cc=t.value.replace(/\D/g,'')||'20';save();return;}
  if(led&&t.dataset&&t.dataset.led){led[t.dataset.led]=t.value;return;}
  if(t.dataset&&t.dataset.color){
    db.theme=db.theme||{};db.theme[t.dataset.color]=t.value;applyTheme();
    clearTimeout(colorT);colorT=setTimeout(save,300);return;
  }
  if(mv&&t.dataset&&t.dataset.mv){mv[t.dataset.mv]=t.type==='checkbox'?t.checked:t.value;return;}
  if(t.tagName==='SELECT'||!od)return;
  if(t.dataset.f){
    var row=t.closest('.line');if(!row)return;var l=od.lines[+row.dataset.i];
    l[t.dataset.f]=(t.dataset.f==='qty'||t.dataset.f==='price')?toNum(t.value):t.value;
    updTotals();return;
  }
  if(t.dataset.od){od[t.dataset.od]=t.value;}
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t.dataset)return;
  if(t.id==='mvPeriod'){mvP=t.value;render();return;}
  if(mv&&t.dataset.mv==='custId'){mv.custId=+t.value||0;paint();return;}
  if(mv&&t.dataset.mv==='itemId'){var mi=byId(db.items,+t.value);mv.itemId=+t.value||0;if(mi)mv.price=mi.price;paint();return;}
  if(!od)return;
  if(t.dataset.f==='itemId'){
    var row=t.closest('.line'),l=od.lines[+row.dataset.i],it=byId(db.items,+t.value);
    l.itemId=+t.value||0;
    if(it){l.name=it.name;l.unit=it.unit;l.price=it.price;if(!l.qty)l.qty=Math.max(sug(it),1);}
    paint();
  }else if(t.dataset.od==='supplierId'){od.supplierId=+t.value||0;paint();}
});
document.addEventListener('submit',async function(e){
  e.preventDefault();
  var f=e.target,k=f.dataset.form;
  if(k==='item')return saveItem(f);
  if(k==='sup')return saveSup(f);
  if(k==='move')return saveMove();
  if(k==='cust')return saveCust(f);
  if(k==='led')return saveLed();
  if(k==='setup'){
    var p1=$('#pw1').value,p2=$('#pw2').value;
    if(p1.length<4)return ferr('كلمة المرور أقل من 4 أحرف.');
    if(p1!==p2)return ferr('كلمتا المرور غير متطابقتين.');
    db.salt=randSalt();db.pass=await hash(p1,db.salt);
    if(!db.items.length&&!db.suppliers.length)seedDemo();
    save();showMain();return;
  }
  if(k==='login'){
    var h=await hash($('#pw1').value,db.salt);
    if(h===db.pass){tab='home';showMain();}else{ferr('كلمة المرور غير صحيحة.');var i=$('#pw1');i.value='';i.focus();}
    return;
  }
  if(k==='pw'){
    var o=await hash($('#pw-old').value,db.salt);
    if(o!==db.pass)return ferr('كلمة المرور الحالية غير صحيحة.');
    var n1=$('#pw-new').value,n2=$('#pw-new2').value;
    if(n1.length<4)return ferr('كلمة المرور الجديدة أقل من 4 أحرف.');
    if(n1!==n2)return ferr('كلمتا المرور الجديدتان غير متطابقتين.');
    db.salt=randSalt();db.pass=await hash(n1,db.salt);save();
    f.reset();var er=$('#err');if(er)er.hidden=true;toast('تم تغيير كلمة المرور');
  }
});

/* ---------- boot ---------- */
function applyLayout(){
  var m=db.layout||'auto',land=m==='land'||(m==='auto'&&window.innerWidth>window.innerHeight);
  $('#root').classList.toggle('land',land);
}
window.addEventListener('resize',applyLayout);
window.addEventListener('orientationchange',applyLayout);
applyLayout();
applyTheme();
renderLock();
})();
</script>
<script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
